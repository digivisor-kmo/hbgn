    { id:"atmosfear", naam:"Atmosfear", kort:"gratis", fig:"zandloper",

  var FB = '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" ' +
    'style="vertical-align:-4px"><path fill="currentColor" d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z"/></svg>';

  var VB = {
    wordmerk:"%%VB:wordmerk%%", datum:"%%VB:datum%%", gratis:"%%VB:gratis%%",
    dobbelsteen:"%%VB:dobbelsteen%%", jokerkaart:"%%VB:jokerkaart%%",
    schedel:"%%VB:schedel%%", zandloper:"%%VB:zandloper%%"
  };
  var FB_URL = "https://www.facebook.com/events/1445920600735035/";
  var MAIL = "mailto:depoortwachter666@gmail.com";
  var AVOND = new Date("2026-11-07T18:00:00+01:00");

  function fig(naam){
    return '<svg viewBox="' + VB[naam] + '" aria-hidden="true" focusable="false">' +
      '<use href="#s-' + naam + '"/></svg>';
  }

  var app = document.getElementById("app");
  var venster = document.getElementById("infovenster");
  var bliksem = document.getElementById("bliksem");
  var vulling = document.querySelector(".voortgang i");
  var boeking = null, stap = 1, deelnemerIx = 0, laatsteInfoKnop = null;
  var klok = null, waarnemer = null, boeGezien = false;
  var fotos = [], loopt = false;

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function vind(id){ return ACTIVITEITEN.filter(function(a){ return a.id === id; })[0] || null; }

  var stil = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ============================================================
     BEWEGING: één rAF-lus voor de voortgang, de parallax en het rail
     ============================================================ */
  var hero = null, heroBeeld = null, heroIn = null, vak = null;
  var topbalk = document.getElementById("topbalk");
  var klein = window.matchMedia("(max-width: 900px)");

  /* alles wat de browser moet uitrekenen, rekenen we één keer uit en onthouden we.
     Tijdens het scrollen wordt er alleen nog geschreven, nooit meer gemeten. */
  var maat = {pagina:0, heroTop:0, heroHoog:1, vakTop:0, vakHoog:0, banden:[]};

  function meet(){
    fotos = [].slice.call(document.querySelectorAll(".band-foto"));
    hero = document.querySelector(".hero");
    heroBeeld = document.querySelector(".hero-beeld");
    heroIn = document.querySelector(".hero-in");
    vak = document.getElementById("inschrijven");

    var y = window.scrollY || window.pageYOffset;
    maat.pagina = document.documentElement.scrollHeight;
    if(hero){
      var r = hero.getBoundingClientRect();
      maat.heroTop = r.top + y; maat.heroHoog = Math.max(1, r.height);
    }
    if(vak){
      var v = vak.getBoundingClientRect();
      maat.vakTop = v.top + y; maat.vakHoog = v.height;
    }
    maat.banden = klein.matches ? [] : fotos.map(function(f){
      var b = f.parentNode.getBoundingClientRect();
      return {el:f, top:b.top + y, h:b.height};
    });
    schuif();
  }

  function schuif(){
    var y = window.scrollY || window.pageYOffset;
    var hoog = window.innerHeight;
    var totaal = maat.pagina - hoog;
    if(vulling) vulling.style.setProperty("--sp", totaal > 0 ? Math.min(1, y / totaal) : 0);

    if(hero){
      var heroOnder = maat.heroTop + maat.heroHoog - y;
      if(!stil && heroBeeld){
        if(heroOnder > 0){
          var q = Math.min(1, Math.max(0, (y - maat.heroTop) / maat.heroHoog));
          hero.classList.add("beweegt");
          heroBeeld.style.transform = "translate3d(0," + (q * 16).toFixed(2) + "%,0) scale(" +
            (1 + q * .1).toFixed(3) + ")";
          heroIn.style.transform = "translate3d(0," + (-q * 60).toFixed(0) + "px,0)";
          heroIn.style.opacity = Math.max(0, 1 - q * 1.35).toFixed(2);
        } else if(hero.classList.contains("beweegt")){
          hero.classList.remove("beweegt");
        }
      }

      /* de balk komt zodra de affiche weg is en gaat weg zodra je bij het formulier bent */
      var bijVak = maat.vakHoog > 0 &&
        (maat.vakTop - y) < hoog * .55 && (maat.vakTop + maat.vakHoog - y) > hoog * .3;
      topbalk.classList.toggle("aan", heroOnder < 60 && !bijVak);
    }

    for(var i = 0; i < maat.banden.length; i++){
      var b = maat.banden[i], top = b.top - y;
      if(top + b.h < -200 || top > hoog + 200) continue;
      var p = (hoog - top) / (hoog + b.h);
      b.el.style.setProperty("--y", ((p - .5) * b.h * .22).toFixed(1) + "px");
    }

    loopt = false;
  }

  function opScroll(){
    if(loopt) return;
    loopt = true;
    requestAnimationFrame(schuif);
  }
  window.addEventListener("scroll", opScroll, {passive:true});
  var maatKlok = null;
  window.addEventListener("resize", function(){
    clearTimeout(maatKlok);
    maatKlok = setTimeout(meet, 180);
  }, {passive:true});

  /* het licht dat de muis meedraagt, alleen waar er een muis is */
  var toorts = document.getElementById("toorts");
  if(!stil && window.matchMedia("(hover: hover) and (pointer: fine)").matches){
    var mx = 0, my = 0, wacht = false;
    window.addEventListener("pointermove", function(e){
      mx = e.clientX; my = e.clientY;
      if(wacht) return;
      wacht = true;
      requestAnimationFrame(function(){
        toorts.style.setProperty("--mx", mx + "px");
        toorts.style.setProperty("--my", my + "px");
        toorts.classList.add("aan");
        wacht = false;
      });
    }, {passive:true});
  }

  /* traag opstijgende vonken */
  (function vonken(){
    if(stil) return;
    var vak = document.getElementById("vonken"), uit = "";
    var hoeveel = window.innerWidth < 700 ? 7 : 16;
    for(var i = 0; i < hoeveel; i++){
      var duur = 16 + Math.random() * 20;
      uit += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;' +
        'animation-duration:' + duur.toFixed(1) + 's;' +
        'animation-delay:-' + (Math.random() * duur).toFixed(1) + 's;' +
        '--dx:' + (Math.random() * 10 - 5).toFixed(1) + 'vw"></i>';
    }
    vak.innerHTML = uit;
  })();
  /* ---------- alles wat .op draagt komt binnen bij het scrollen ---------- */
  function wekOp(wortel){
    var dingen = (wortel || document).querySelectorAll(".op:not(.in)");
    if(stil || !("IntersectionObserver" in window)){
      [].forEach.call(dingen, function(el){ el.classList.add("in"); });
      return;
    }
    if(!waarnemer){
      waarnemer = new IntersectionObserver(function(rijen){
        rijen.forEach(function(r){
          if(!r.isIntersecting) return;
          r.target.classList.add("in");
          waarnemer.unobserve(r.target);
          if(r.target.classList.contains("boe-woord")){ boeGezien = true; flits(); }
        });
      }, {rootMargin:"0px 0px -14% 0px", threshold:.12});
    }
    [].forEach.call(dingen, function(el){ waarnemer.observe(el); });
  }

  /* externe links openen in een nieuw venster, zodat niemand de pagina kwijtraakt */
  function blanko(wortel){
    [].forEach.call((wortel || document).querySelectorAll("a[href]"), function(a){
      var h = a.getAttribute("href") || "";
      if(/^https?:/i.test(h) && a.hostname && a.hostname !== location.hostname){
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      }
    });
  }

  function flits(){
    if(stil) return;
    bliksem.classList.remove("flits");
    void bliksem.offsetWidth;
    bliksem.classList.add("flits");
  }
  /* af en toe onweer, maar pas nadat BOE geweest is en niet zo vaak dat het stoort */
  function onweer(){
    setTimeout(function(){
      if(boeGezien && !document.hidden && !stil) flits();
      onweer();
    }, 24000 + Math.random() * 28000);
  }

  /* ---------- de sierletter pas ophalen als het dringende werk gedaan is ---------- */
  (function sierletter(){
    function aan(){ document.documentElement.classList.add("laat"); }
    if(document.readyState === "complete"){ setTimeout(aan, 1); }
    else window.addEventListener("load", function(){
      (window.requestIdleCallback || function(c){ setTimeout(c, 300); })(aan, {timeout:1800});
    });
  })();

  /* ---------- de zware tekeningen pas inhangen als er tijd over is ---------- */
  (function figuren(){
    var bron = document.getElementById("fig-defs");
    if(!bron) return;
    function hang(){
      if(!bron.textContent) return;
      var svg = document.querySelector("svg.defs");
      if(!svg) return;
      var los = document.createElement("div");
      los.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg"><defs>' +
        bron.textContent + '</defs></svg>';
      var defs = svg.querySelector("defs");
      var nieuwe = los.firstChild.firstChild.childNodes;
      while(nieuwe.length) defs.appendChild(nieuwe[0]);
      bron.textContent = "";
      /* verwijzingen die al op de pagina stonden opnieuw laten opzoeken */
      [].forEach.call(document.querySelectorAll('use[href^="#s-"]'), function(u){
        var h = u.getAttribute("href");
        u.removeAttribute("href");
        u.setAttribute("href", h);
      });
    }
    (window.requestIdleCallback || function(c){ setTimeout(c, 200); })(hang, {timeout:1500});
  })();

  /* ---------- de spin ----------
     Ze hangt aan het scherm en niet aan de pagina, dus scrollen schudt haar
     er niet af. Ze wandelt in stappen rond, blijft af en toe staan, verdwijnt
     langs een rand en duikt later ergens anders weer op. Soms komt ze in de
     plaats daarvan aan een draad naar beneden. */
  (function spin(){
    if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    var POTEN =
      /* de achterste vier */
      '<g class="poot-b">' +
        '<path d="M41,46 Q16,52 8,61"/><path d="M41,51 Q22,67 15,79"/>' +
        '<path d="M59,46 Q84,52 92,61"/><path d="M59,51 Q78,67 85,79"/>' +
      '</g>' +
      /* de voorste vier */
      '<g class="poot-a">' +
        '<path d="M41,36 Q19,17 8,21"/><path d="M41,41 Q15,34 5,40"/>' +
        '<path d="M59,36 Q81,17 92,21"/><path d="M59,41 Q85,34 95,40"/>' +
      '</g>';

    var TEKENING =
      '<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">' +
        '<g fill="none" stroke="#07030d" stroke-width="3.4" stroke-linecap="round">' + POTEN + '</g>' +
        '<g fill="#07030d">' +
          '<ellipse cx="50" cy="63" rx="15.5" ry="19"/>' +
          '<ellipse cx="50" cy="41" rx="10" ry="11"/>' +
          '<path d="M45,32 q-2,-5 -4,-7" stroke="#07030d" stroke-width="2.6" ' +
            'stroke-linecap="round" fill="none"/>' +
          '<path d="M55,32 q2,-5 4,-7" stroke="#07030d" stroke-width="2.6" ' +
            'stroke-linecap="round" fill="none"/>' +
        '</g>' +
        /* een streepje maanlicht op het achterlijf, zodat ze bol lijkt */
        '<ellipse cx="45" cy="56" rx="6" ry="8.5" fill="rgba(178,92,255,.13)" ' +
          'transform="rotate(-18 45 56)"/>' +
        /* en twee oogjes, anders is ze op zwart helemaal niet te zien */
        '<g class="ogen" fill="rgba(178,92,255,.5)">' +
          '<circle cx="46.6" cy="38" r="1.6"/><circle cx="53.4" cy="38" r="1.6"/>' +
        '</g>' +
      '</svg>';

    var veld = document.createElement("div");
    veld.className = "spinnenveld";
    veld.setAttribute("aria-hidden", "true");
    veld.innerHTML = '<div class="spin"><span class="spin-draad"></span>' +
                     '<div class="spin-lijf">' + TEKENING + '</div></div>';
    document.body.appendChild(veld);
    var beest = veld.firstChild;

    var x = 0, y = 0, bezigNu = false;
    function B(){ return window.innerWidth  || 1200; }
    function Hg(){ return window.innerHeight || 800; }
    function tussen(a, b){ return a + Math.random() * (b - a); }

    function plaats(nx, ny){
      x = nx; y = ny;
      beest.style.setProperty("--x", Math.round(nx) + "px");
      beest.style.setProperty("--y", Math.round(ny) + "px");
    }
    function richt(g){ beest.style.setProperty("--r", g.toFixed(1) + "deg"); }
    /* zonder animatie ergens neerzetten */
    function spring(nx, ny){
      beest.style.setProperty("--dur", "0ms");
      void beest.offsetWidth;
      plaats(nx, ny);
      void beest.offsetWidth;
    }
    /* eerst draaien naar waar ze heen wil, dan pas lopen */
    function ga(nx, ny, tempo, soep, na){
      var dx = nx - x, dy = ny - y;
      var d = Math.sqrt(dx * dx + dy * dy);
      var ms = Math.max(220, d / tempo * 1000);
      richt(Math.atan2(dy, dx) * 180 / Math.PI + 90);
      setTimeout(function(){
        beest.style.setProperty("--soep", soep || "linear");
        beest.style.setProperty("--dur", Math.round(ms) + "ms");
        void beest.offsetWidth;
        beest.classList.add("loopt");
        plaats(nx, ny);
        setTimeout(function(){
          beest.classList.remove("loopt");
          if(na) na();
        }, ms + 40);
      }, 190);
    }

    /* een punt net buiten beeld, om binnen te komen of te verdwijnen */
    function randpunt(){
      var m = 150, k = Math.floor(Math.random() * 4);
      if(k === 0) return [tussen(.1, .9) * B(), -m];
      if(k === 1) return [B() + m, tussen(.1, .9) * Hg()];
      if(k === 2) return [tussen(.1, .9) * B(), Hg() + m];
      return [-m, tussen(.1, .9) * Hg()];
    }
    function binnenpunt(){ return [tussen(.07, .93) * B(), tussen(.09, .9) * Hg()]; }

    /* rondwandelen: binnenkomen, een paar keer van hoek veranderen, weg */
    function zwerf(klaar){
      var p = randpunt();
      spring(p[0], p[1]);
      beest.classList.add("aan");
      var stappen = 2 + Math.floor(Math.random() * 4);
      (function volgende(){
        if(stappen-- <= 0){
          var u = randpunt();
          ga(u[0], u[1], tussen(500, 850), "cubic-bezier(.3,0,.7,1)", function(){
            beest.classList.remove("aan");
            klaar();
          });
          return;
        }
        var t = binnenpunt();
        /* soms slentert ze, soms schiet ze plots vooruit */
        var tempo = Math.random() < .35 ? tussen(430, 720) : tussen(140, 330);
        ga(t[0], t[1], tempo, "cubic-bezier(.35,0,.65,1)", function(){
          setTimeout(volgende, tussen(120, 1400));
        });
      })();
    }

    /* aan een draad naar beneden en dan omhoog of eraf en weglopen */
    function val(klaar){
      var px = tussen(.15, .85) * B(), diep = tussen(.2, .5) * Hg();
      spring(px, -170);
      richt(tussen(-6, 6));
      beest.classList.add("aan");
      beest.classList.add("draad");
      setTimeout(function(){
        beest.style.setProperty("--soep", "cubic-bezier(.3,1.45,.5,1)");
        beest.style.setProperty("--dur", "640ms");
        void beest.offsetWidth;
        beest.classList.add("loopt");
        plaats(px, diep);
        setTimeout(function(){
          beest.classList.remove("loopt");
          beest.classList.add("bengelt");
          setTimeout(function(){
            beest.classList.remove("bengelt");
            if(Math.random() < .5){
              /* ze laat los, valt op de pagina en gaat er lopend vandoor */
              beest.classList.remove("draad");
              beest.style.setProperty("--soep", "cubic-bezier(.4,0,.9,.5)");
              beest.style.setProperty("--dur", "430ms");
              void beest.offsetWidth;
              beest.classList.add("loopt");
              plaats(px, Hg() * tussen(.7, .93));
              setTimeout(function(){
                beest.classList.remove("loopt");
                var u = randpunt();
                ga(u[0], u[1], tussen(480, 780), "cubic-bezier(.3,0,.7,1)", function(){
                  beest.classList.remove("aan");
                  klaar();
                });
              }, 620);
            } else {
              /* of ze trekt zichzelf weer omhoog */
              beest.style.setProperty("--soep", "cubic-bezier(.5,0,.9,.55)");
              beest.style.setProperty("--dur", "540ms");
              void beest.offsetWidth;
              beest.classList.add("loopt");
              plaats(px, -170);
              setTimeout(function(){
                beest.classList.remove("loopt");
                beest.classList.remove("aan");
                beest.classList.remove("draad");
                klaar();
              }, 580);

            '><span>' + esc(tekst) +
            (uitleg ? '<em>' + esc(uitleg) + '</em>' : "") + '</span></label>';
        }).join("") + '</div></fieldset>';
    }).join("");

    doel.innerHTML = raster(2,
      '<p class="gekozen">Je schrijft in voor <strong>' + esc(a.naam) + '</strong>' + infoKnop(a) + '</p>' +
      '<p class="teller">Persoon ' + (deelnemerIx + 1) + ' van ' + boeking.aantal + '</p>' +
      '<form id="f" novalidate>' +
        '<div class="veld"><label for="naam">Naam</label>' +
        '<input id="naam" type="text" autocomplete="name" value="' + esc(p.naam) + '"></div>' +
        '<div class="veld"><label for="mail">E-mailadres' +
          (eerste ? ' <em class="vereist">verplicht</em>' : ' <em class="optioneel">mag leeg</em>') +
        '</label>' +
        '<input id="mail" type="email" autocomplete="email" value="' + esc(p.mail) + '">' +
        '<p class="fijn">' + (eerste
          ? "Hier stuur ik het uur van je spelletje naartoe zodra ik het beslist heb."
          : "Alleen invullen als deze persoon zelf bericht wil. Anders mail ik enkel de eerste.")
        + '</p></div>' +
        vragen +
        '<p class="fout" id="fout" role="alert"></p>' +
        '<p class="acties"><button type="submit" class="hoofd">' +
          (deelnemerIx + 1 < boeking.aantal ? "Volgende persoon" : "Alles nakijken") +
        '</button><button type="button" id="terug">Terug</button></p>' +
      '</form>');

    hangInfo(doel);

    document.getElementById("terug").addEventListener("click", function(){
      if(deelnemerIx === 0){ stap = 1; } else { deelnemerIx--; }
      tekenFormulier(); springNaarFormulier();
    });

    document.getElementById("f").addEventListener("submit", function(e){
      e.preventDefault();
      p.naam = document.getElementById("naam").value.trim();
      p.mail = document.getElementById("mail").value.trim();
      a.vragen.forEach(function(v){
        var g = doel.querySelector('input[name="' + v.id + '"]:checked');
        p.antw[v.id] = g ? g.value : "";
      });
      if(!p.naam){ toonFout("ANTWOORD MIJ!!! Hoe heet je?"); document.getElementById("naam").focus(); return; }
      if(eerste && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(p.mail)){
        toonFout("Dat mailadres klopt niet. Kijk nog eens goed."); document.getElementById("mail").focus(); return; }
      if(!eerste && p.mail && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(p.mail)){
        toonFout("Dat tweede mailadres klopt niet. Laat het leeg of doe het juist."); return; }
      var mist = a.vragen.filter(function(v){ return !p.antw[v.id]; });
      if(mist.length){ toonFout("GEEF ANTWOORD: " + mist[0].label); return; }
      if(deelnemerIx + 1 < boeking.aantal){ deelnemerIx++; } else { stap = 3; }
      tekenFormulier(); springNaarFormulier();
    });
  }

  function stapOverzicht(doel){
    var a = vind(boeking.act);
    var lijst = boeking.mensen.map(function(p){
      return '<li>' +
        '<p class="ticket-naam">' + esc(p.naam) +
          (p.mail ? '<span>' + esc(p.mail) + '</span>' : "") + '</p>' +
        '<dl class="ticket-antw">' + a.vragen.map(function(v){
          return '<dt>' + esc(v.label.replace(/\?$/, "")) + '</dt><dd>' + esc(p.antw[v.id]) + '</dd>';
        }).join("") + '</dl></li>';
    }).join("");

    doel.innerHTML = raster(3,
      '<div class="ticket">' +
        '<div class="ticket-fig" aria-hidden="true">' + fig(a.fig) + '</div>' +
        '<p class="ticket-kop">' + esc(a.naam) + '</p>' +
        '<dl class="ticket-feiten">' +
          '<dt>Wanneer</dt><dd>Za 7 nov 2026, uur volgt</dd>' +
          '<dt>Waar</dt><dd>Kerk Minnestraat, Lebbeke</dd>' +
          '<dt>Personen</dt><dd>' + boeking.aantal + '</dd>' +
          '<dt>Wat het kost</dt><dd>' + esc(a.kost) + '</dd>' +
        '</dl>' +
        '<ol class="ticket-lijst">' + lijst + '</ol>' +
      '</div>' +
      '<form id="f" novalidate>' +
        '<p class="vzw"><label for="gastenboek">Laat dit veld leeg</label>' +
        '<input id="gastenboek" name="gastenboek" type="text" tabindex="-1" autocomplete="off"></p>' +
        '<p class="fout" id="fout" role="alert"></p>' +
        '<p class="acties"><button type="submit" class="hoofd">Ja, mijn Poortwachter!</button>' +
        '<button type="button" id="terug">Terug</button></p>' +
      '</form>');

    var terugknop = document.getElementById("terug");
    terugknop.addEventListener("click", function(){
      stap = 2; deelnemerIx = boeking.aantal - 1; tekenFormulier(); springNaarFormulier();
    });
    document.getElementById("f").addEventListener("submit", function(e){
      e.preventDefault();
      verzend(e.target.querySelector('button[type="submit"]'), terugknop);
    });
  }

  /* ---------- de inschrijving naar de server sturen ---------- */
  var wachtvlak = document.getElementById("wachten");
  var bezig = false;

  function toonWacht(aan){
    wachtvlak.classList.toggle("aan", !!aan);
    document.documentElement.style.overflow = aan ? "hidden" : "";
  }

  function verzend(knop, terugknop){
    if(bezig) return;
    bezig = true;

    var a = vind(boeking.act);
    knop.disabled = true;
    terugknop.disabled = true;
    var oudeTekst = knop.textContent;
    knop.textContent = "Ik noteer je...";
    toonWacht(true);

    var val = document.getElementById("gastenboek");

    fetch("/api/inschrijven", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        spelId: a.id,
        gastenboek: val ? val.value : "",
        mensen: boeking.mensen.map(function(p){
          return {
            naam: p.naam,
            email: p.mail,
            antwoorden: a.vragen.map(function(v){
              return {vraag: v.label, antwoord: p.antw[v.id] || ""};
            })
          };
        })
      })
    }).then(function(r){
      return r.json().then(function(j){ return {status:r.status, body:j}; })
                     .catch(function(){ return {status:r.status, body:{}}; });
    }).then(function(uit){
      if(uit.body && uit.body.ok){
        toonWacht(false);
        location.hash = "#/bedankt";
        return;
      }
      toonWacht(false);
      knop.disabled = false; terugknop.disabled = false; knop.textContent = oudeTekst;
      bezig = false;
      var f = uit.body && uit.body.fout;
      if(f === "nog niet ingesteld"){
        toonFout("Mijn lijst ligt nog bij de drukker. Mail me even, dan zet ik je er zelf op.");
      } else if(f === "mailadres" || f === "tweede mailadres"){
        toonFout("Dat mailadres klopt niet. Ga een stap terug en kijk nog eens goed.");
      } else {
        toonFout("Er ging iets mis bij het noteren. Probeer het nog eens. " +
                 "Blijft het misgaan, mail me dan, ik bijt niet. Meestal.");
      }
    }).catch(function(){
      toonWacht(false);
      knop.disabled = false; terugknop.disabled = false; knop.textContent = oudeTekst;
      bezig = false;
      toonFout("Ik krijg geen verbinding. Kijk je internet na en probeer opnieuw.");
    });
  }

  function springNaarFormulier(){
    var k = document.getElementById("inschrijven");
    if(k) k.scrollIntoView();
  }

  /* ============================================================
     APARTE BEDANKINGSPAGINA
     ============================================================ */
  function bedankt(){
    var a = boeking ? vind(boeking.act) : null;
    var eerste = boeking ? boeking.mensen[0] : null;

    app.innerHTML =
      '<main><section class="band band-botten" data-hoofdstuk="Bedankt">' +
      '<div class="band-foto" aria-hidden="true"></div>' +
        '<div class="band-sluier" aria-hidden="true"></div>' +
      '<div class="damp" aria-hidden="true"></div>' +
      '<div class="wrap dank">' +
        '<h1 class="dank-kop op" style="--i:0">Je staat op mijn lijst</h1>' +
        (a
          ? '<div class="dank-bevestiging op" style="--i:1">' +
            '<strong>' + boeking.aantal + ' ' + (boeking.aantal === 1 ? "persoon" : "personen") +
            ' voor ' + esc(a.naam) + '</strong>' +
            'Zaterdag 7 november 2026, Kerk Minnestraat, Lebbeke. Ontsnappen kan niet meer.</div>'
          : '<div class="dank-bevestiging op" style="--i:1"><strong>Genoteerd</strong>' +
            'Ontsnappen kan niet meer.</div>') +

        '<h2 class="op" style="--i:2">Wat er nu gebeurt</h2>' +
        '<ol class="dank-stappen">' +
          '<li class="op" style="--i:3">Je staat op mijn lijst' +
            (eerste && eerste.mail ? ", genoteerd bij " + esc(eerste.mail) : "") +
            '. Daar stuur ik alles naartoe, dus kijk af en toe in je spam. Daar woon ik graag.</li>' +
          '<li class="op" style="--i:4">Zodra ik het uur van je spelletje beslist heb, krijg je ' +
          'bericht van mij. Betalen doe je ter plaatse, cash of met je smartphone.</li>' +
          '<li class="op" style="--i:5">Kan je toch niet komen? Mail het me, dan geef ik je plaats ' +
          'aan iemand die wel durft. Zwijgen is erger dan afzeggen.</li>' +
        '</ol>' +
        '<p class="dank-lach op" style="--i:6">HHAHAHAHAAHAHAHAAAAA!!!!</p>' +

        '<h2 class="op" style="--i:7">Blijf op de hoogte</h2>' +
        '<p class="op" style="--i:8">In de aanloop naar de avond zet ik alles wat ik beslis op mijn ' +
        'Facebook-event: de uren, de toelage en wat ik verder nog voor jullie in petto heb.</p>' +
        '<p class="op" style="--i:9"><a class="dank-fb" href="' + FB_URL + '">' + FB +
        ' Volg het event op Facebook</a></p>' +
        '<p class="op" style="--i:10">Nog iets te vragen? ' +
        '<a href="' + MAIL + '">Mail de Poortwachter</a></p>' +

        '<p><a class="dank-terug" href="#/">Terug naar het begin</a></p>' +
      '</div></section></main>';

    boeking = null; stap = 1; deelnemerIx = 0;
    if(klok){ clearInterval(klok); klok = null; }
    meet();
    blanko(app);
    wekOp(app);
  }

  /* ---------- routering: alleen de bedankingspagina is een eigen adres ---------- */
  function toon(){
    var h = location.hash.replace(/^#/, "");
    if(h === "/bedankt"){ window.scrollTo(0, 0); return bedankt(); }
    home();
    if(h === "inschrijven") springNaarFormulier(); else window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", toon);
  toon();
  onweer();
})();
</script>
